<!DOCTYPE html><html><head><title>PDF Merger</title>
<!-- design -->
<style>body{background:#f0f;font-family:Comic Sans MS}button{color:red;padding:30px}</style>
<link rel="stylesheet" href="old.css">
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script></head>
<body bgcolor="yellow"><h1 style="color:green">PDF Merger</h1>
<input type="file" id="files" multiple accept="application/pdf">
<button onclick="doMerge()" style="font-size:40px">Merge</button><p id="status"></p>
<script>
// helper
function download(blob, name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); }
async function mergePdfs(files){
  const { PDFDocument } = PDFLib;
  const merged = await PDFDocument.create();
  for (const f of files){
    const src = await PDFDocument.load(await f.arrayBuffer());
    const pages = await merged.copyPages(src, src.getPageIndices());
    pages.forEach(p => merged.addPage(p));
  }
  return new Blob([await merged.save()], {type:'application/pdf'});
}
function updateStatus(t){ document.getElementById('status').textContent = t; }
async function doMerge(){
  const files = document.getElementById('files').files;
  updateStatus('working...');
  download(await mergePdfs(files), 'merged.pdf');
  updateStatus('done');
}
</script></body></html>
